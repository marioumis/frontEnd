<div class="sidebar">
  <!-- Top section with logo and nav -->
  <div class="sidebar-top">
    
    <!-- Logo -->
    <div class="header-row">
      <div class="logo">
        <span class="logo-mark">
          <!-- White minimalist logo to fit dark sidebar -->
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="14" y="18" width="36" height="40" rx="8" fill="#FFFFFF" opacity="0.2"/>
            <rect x="10" y="12" width="36" height="40" rx="8" fill="#FFFFFF" opacity="0.4"/>
            <g transform="rotate(-6 28 28)">
              <rect x="8" y="6" width="36" height="40" rx="8" fill="#4D6FB5"/>
              <rect x="16" y="16" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9"/>
              <rect x="16" y="23" width="14" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
              <rect x="16" y="30" width="17" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
            </g>
          </svg>
        </span>
        <span class="logo-text">Templora</span>
      </div>
      
      <div class="utility-icons">
        <button class="icon-btn hover-3d">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="status-dot"></span>
        </button>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      
      <!-- Workspace Group -->
      <div class="nav-group-title">WORKSPACE</div>
      
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-link hover-3d">
          <div class="nav-icon-wrapper">
            <ng-container [ngSwitch]="item.icon">
              <!-- Bolder modern icons (Lucide/Feather mix) -->
              <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="9" rx="2"></rect>
                <rect x="14" y="3" width="7" height="5" rx="2"></rect>
                <rect x="14" y="12" width="7" height="9" rx="2"></rect>
                <rect x="3" y="16" width="7" height="5" rx="2"></rect>
              </svg>

              <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>

              <svg *ngSwitchCase="'invitations'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
              </svg>

              <svg *ngSwitchCase="'departments'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18"></path>
                <path d="M9 8h1"></path>
                <path d="M9 12h1"></path>
                <path d="M9 16h1"></path>
                <path d="M14 8h1"></path>
                <path d="M14 12h1"></path>
                <path d="M14 16h1"></path>
                <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
              </svg>

              <svg *ngSwitchCase="'categories'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>

              <svg *ngSwitchCase="'templates'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>

              <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              
              <svg *ngSwitchCase="'history'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>

            </ng-container>
          </div>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- Bottom Section: User Profile matching screenshot -->
  <div class="sidebar-bottom">
    <div class="divider"></div>
    
    @if (currentUser()) {
      <div class="user-bottom-profile">
        <div class="user-avatar-small">
          <div class="avatar-gradient">
            {{ userInitials }}
          </div>
          <span class="user-status-indicator"></span>
        </div>
        
        <div class="user-info">
          <div class="user-name">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</div>
          <div class="user-role">{{ currentUser()?.departmentName || 'Admin' }}</div>
        </div>
        
        <!-- Explicit Logout Button -->
        <button class="user-logout-btn" (click)="logout()" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5zM5 21a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    }
  </div>
</div>
